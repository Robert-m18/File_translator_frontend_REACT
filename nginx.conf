server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresja odpowiedzi. Bundle Reacta to kilkaset kilobajtów tekstu,
    # po gzipie schodzi do ułamka tego rozmiaru.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Routing należy do react-routera, nie do nginxa.
    #
    # Wejście wprost na /reset-password (albo odświeżenie strony na tym adresie)
    # to dla serwera żądanie o plik, którego na dysku nie ma - bez tej linii
    # użytkownik dostałby 404 zamiast aplikacji. Oddajemy index.html, a router
    # po stronie przeglądarki dopiero wtedy patrzy na ścieżkę.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite wstawia hash treści w nazwę każdego pliku w /assets (index-a1b2c3.js).
    # Zmiana zawartości = zmiana nazwy, więc stary plik nigdy nie stanie się
    # nieaktualny i można go cache'ować bezterminowo.
    # Samo add_header, bez dyrektywy "expires" - obie ustawiają Cache-Control
    # i razem wysyłają ten nagłówek dwa razy.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # index.html hasha NIE ma - to on wskazuje na aktualne pliki z /assets.
    # Gdyby przeglądarka trzymała go w cache'u, po wdrożeniu nowej wersji
    # ładowałaby stary bundle i nie byłoby widać żadnej zmiany.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
